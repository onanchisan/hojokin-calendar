name: daily-update

on:
  schedule:
    - cron: '30 20 * * *'   # 毎日 05:30 JST (UTC 20:30)
  workflow_dispatch: {}      # 手動実行ボタン用

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Git ユーザー設定
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
      - name: 取得・生成・検証・公開
        env:
          # テスト時だけ設定する変数。未設定なら site.config.json の baseUrl を使う
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: node scripts/daily.mjs
      - name: さくらのサーバーへアップロード(Secrets設定済みの場合のみ)
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
          SAKURA_SSH_KEY: ${{ secrets.SAKURA_SSH_KEY }}
          # アップロード先(サーバー上のパス)。まず -test で試し、成功後に本番へ切り替える
          SAKURA_DEST: ${{ vars.SAKURA_DEST || 'www/onanchi/service/hojokin-calendar' }}
        run: |
          if [ -z "$SAKURA_HOST" ] || [ -z "$SAKURA_USER" ] || [ -z "$SAKURA_SSH_KEY" ]; then
            echo "Secrets未設定のためアップロードをスキップ"; exit 0
          fi
          # 誤設定で他のファイルを消さないための安全装置
          case "$SAKURA_DEST" in www/onanchi/service/?*) ;; *) echo "SAKURA_DESTは www/onanchi/service/ 配下のみ許可"; exit 1;; esac
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          # Windowsで貼り付けた鍵の改行コード(CRLF)を直す
          printf '%s\n' "$SAKURA_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "鍵の形式チェック(中身は表示しない):"
          head -1 ~/.ssh/id_deploy | cut -c1-35
          tail -1 ~/.ssh/id_deploy | cut -c1-35
          ssh-keygen -y -f ~/.ssh/id_deploy > /dev/null && echo "鍵の読み込みOK" || echo "鍵の読み込みNG(Secretの貼り付け内容を確認)"
          echo "GitHubが使っている鍵の指紋(公開しても安全):"
          ssh-keygen -y -f ~/.ssh/id_deploy | ssh-keygen -lf - | cut -d' ' -f1-2
          echo "接続先: ${SAKURA_USER}@${SAKURA_HOST}"
          ssh-keyscan -H "$SAKURA_HOST" >> ~/.ssh/known_hosts 2>/dev/null || echo "ホストに到達できない(SAKURA_HOSTを確認)"
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20"
          # 診断: 接続の失敗理由だけを表示する
          $SSH -v "$SAKURA_USER@$SAKURA_HOST" "echo 接続OK" 2>&1 | grep -E "Authenticated|Permission denied|Could not resolve|Connection (refused|timed out)|Authentications that can continue|接続OK|no such identity|invalid format" || true
          $SSH "$SAKURA_USER@$SAKURA_HOST" "mkdir -p '$SAKURA_DEST'"
          # 専用フォルダの中だけを同期する(他のファイルには触れない)
          rsync -rz --delete -e "$SSH" docs/ "$SAKURA_USER@$SAKURA_HOST:$SAKURA_DEST/"
          echo "アップロード完了: $SAKURA_DEST"
      - name: onanchi.com のトップページ等をアップロード(portalフォルダ)
        env:
          SAKURA_HOST: ${{ secrets.SAKURA_HOST }}
          SAKURA_USER: ${{ secrets.SAKURA_USER }}
        run: |
          # 前のステップで鍵が作られていない(Secrets未設定)場合はスキップ
          [ -f ~/.ssh/id_deploy ] || { echo "鍵なし。スキップ"; exit 0; }
          SSH="ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=20"
          # --delete は付けない。portal内のファイルを公開フォルダ直下へ上書きコピーするだけ
          rsync -rz -e "$SSH" portal/ "$SAKURA_USER@$SAKURA_HOST:www/onanchi/"
          echo "トップページ等のアップロード完了"
